<title>小港重訓手帳</title>
<!-- Launch splash (same idea as app-template motion/ "white-start"): critical CSS sits before every
     stylesheet so the first paint never waits on the network. Dark mode only: iOS hands over a white
     WebView; instead of hard-cutting white -> dark we start at that white and sink into the dark bg. -->
<style>
html{background:#F8F6F1}
@media (prefers-color-scheme:dark){html{background:#13161B}}
#splash{display:none}
html.sp-on body{background:transparent}
html.sp-on #splash{display:flex;position:fixed;inset:0;z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#ebebeb;animation:sp-sink 700ms cubic-bezier(.2,0,0,1) 340ms forwards}
html.sp-on #splash svg{width:76px;height:76px;opacity:0;transform:scale(.92);animation:sp-emerge 600ms cubic-bezier(.2,0,0,1) 340ms forwards}
html.sp-on #splash b{font:700 20px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#ECEEF2;opacity:0;animation:sp-fade 420ms ease 1040ms forwards}
html.sp-on #splash.out{opacity:0;transition:opacity 280ms ease}
@keyframes sp-sink{to{background:#13161B}}
@keyframes sp-emerge{to{opacity:1;transform:none}}
@keyframes sp-fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  html.sp-on #splash{animation:none;background:#13161B}
  html.sp-on #splash svg,html.sp-on #splash b{animation:none;opacity:1;transform:none}
}
</style>
<script>
(function(){
  var d=document.documentElement;
  try{if(sessionStorage.getItem('xg-sp'))return;sessionStorage.setItem('xg-sp','1');}catch(e){}
  if(!window.matchMedia||!matchMedia('(prefers-color-scheme:dark)').matches)return;
  d.classList.add('sp-on');
  window.__spT0=Date.now();
  setTimeout(function(){d.classList.remove('sp-on');},4000); /* failsafe */
})();
</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- non-blocking: first paint must not wait for Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"></noscript>
<style>
/* Layout idea: a pocket logbook shared by a few people. Ivory + runway orange from the building's palette; one chip per person at the top, plan generated from each person's own body data. */
:root{
  --bg:#F8F6F1; --surface:#FFFFFF; --ink:#1C232E; --muted:#667080;
  --accent:#EE6A1C; --line:#E6E1D6; --ok:#1E8757; --warn:#A86A12; --bad:#C2412D;
  --accent-soft:#FDEBDD; --warn-soft:#FBF0DA; --ok-soft:#E1F2E9;
  --display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13161B; --surface:#1B1F26; --ink:#ECEEF2; --muted:#98A1AD;
    --accent:#FF8A3D; --line:#2A303A; --ok:#4CC08A; --warn:#E3A84A; --bad:#F07560;
    --accent-soft:#3A2416; --warn-soft:#352A16; --ok-soft:#173226;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161B; --surface:#1B1F26; --ink:#ECEEF2; --muted:#98A1AD;
  --accent:#FF8A3D; --line:#2A303A; --ok:#4CC08A; --warn:#E3A84A; --bad:#F07560;
  --accent-soft:#3A2416; --warn-soft:#352A16; --ok-soft:#173226;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}

header.top{padding:20px 0 10px}
header.top h1{font-size:26px;font-weight:900;letter-spacing:.02em}
header.top h1 span{color:var(--accent)}
header.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.runway{height:4px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 30px);border-radius:2px;margin-bottom:12px;opacity:.85}
.people{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.people button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:40px}
.people button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.people .add{color:var(--accent);border-style:dashed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.label{font-size:13px;color:var(--muted);font-weight:500}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.f2{background:var(--accent-soft);color:var(--accent)}
.fany{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.sure{background:var(--ok-soft);color:var(--ok)}
.guess{background:var(--warn-soft);color:var(--warn)}

/* form */
form.prof{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field legend{font-size:14px;font-weight:700;padding:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.txt{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:17px}
.unit{position:relative}
.unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:13px;pointer-events:none}
.opts{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:15px;line-height:1.3}
.opt span small{font-weight:400;font-size:11px;color:var(--muted)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.opt input:checked+span small{color:#fff;opacity:.85}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:14px;font-weight:500;min-height:1em;margin:0}

/* plan */
.why{display:flex;flex-direction:column;gap:8px}
.why li{font-size:14px}
.why ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.body-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bs{background:var(--bg);border-radius:10px;padding:10px 6px;text-align:center}
.bs b{font-size:26px;line-height:1;display:block}
.bs small{font-size:12px;color:var(--muted);display:block}
.bs i{font-style:normal;font-size:12px;font-weight:700}
.day{display:flex;flex-direction:column;gap:12px;border-left:5px solid var(--line)}
.day.next{border-left-color:var(--accent)}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.day-head h2{font-size:20px;font-weight:900}
.day-head .meta{color:var(--muted);font-size:13px}
.mins{text-align:right;flex-shrink:0}
.mins b{font-size:28px;line-height:1;display:block}
.mins small{color:var(--muted);font-size:12px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.exlist li:first-child{border-top:0}
.exlist .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle;background:var(--warn)}
.exlist .sr{font-size:18px;color:var(--muted)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.notes{display:grid;gap:10px}
.note{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px}
.note b.k{font-family:var(--display);font-size:20px;color:var(--accent);line-height:1.2}
.note p{margin:0}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:#fff;border-radius:14px;padding:14px 16px}
.banner .btn{background:#fff;color:var(--accent);border:0}
h2.sec{font-size:15px;color:var(--muted);font-weight:700;margin:20px 0 10px;letter-spacing:.04em}
.tag-next{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* workout */
.wk-head{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.wk-head h2{font-size:18px;font-weight:900}
.clock{text-align:right}
.clock b{font-size:30px;line-height:1}
.clock small{display:block;font-size:12px;color:var(--muted)}
.clock.over b{color:var(--bad)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ex{display:flex;flex-direction:column;gap:10px}
.ex.done{opacity:.6}
.ex-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-top h3{font-size:18px;font-weight:700}
.ex .presc{font-size:15px;color:var(--muted)}
.ex .presc b{color:var(--ink);font-size:20px}
.cue{font-size:14px;color:var(--muted);margin:0;padding-left:10px;border-left:3px solid var(--line)}
.cue.warn{color:var(--warn);border-left-color:var(--warn)}
.cue.sug{color:var(--accent);border-left-color:var(--accent)}
.last{font-size:13px;color:var(--ok);font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.set.hd small{text-align:center;color:var(--muted);font-size:12px}
.set input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:600 18px var(--display);text-align:center;padding:0 6px}
.set input::placeholder{color:var(--muted);font-family:var(--body);font-size:13px;font-weight:400}
.tick{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:900;font-size:18px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.swap{font-size:13px;padding:6px 10px;min-height:36px;border-radius:999px;flex-shrink:0}

/* rest + nav */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:20;display:none}
.rest.on{display:block}
.rest .in{max-width:608px;margin:0 16px 8px;padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:640px){.rest .in{margin:0 auto 8px}}
.rest b{font-size:34px;line-height:1}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hist-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.hist-item .d{text-align:center;min-width:44px}
.hist-item .d b{font-size:26px;line-height:1;display:block}
.hist-item .d small{font-size:12px;color:var(--muted)}
.hist-item h3{font-size:16px}
.hist-item p{margin:0;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:30px;line-height:1;display:block}
.stat small{font-size:12px;color:var(--muted)}

.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.info dt{font-weight:700}
.info dd{margin:0;color:var(--muted)}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--accent)}
.src ul{padding-left:18px;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg viewBox="0 0 512 512"><defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F47A2C"/><stop offset="1" stop-color="#E05A10"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#spg)"/><g fill="#FFFFFF" opacity=".55"><rect x="90" y="374" width="44" height="14" rx="7"/><rect x="162" y="374" width="44" height="14" rx="7"/><rect x="234" y="374" width="44" height="14" rx="7"/><rect x="306" y="374" width="44" height="14" rx="7"/><rect x="378" y="374" width="44" height="14" rx="7"/></g><g transform="rotate(-16 256 236)" fill="#FFFFFF"><rect x="112" y="223" width="288" height="26" rx="10"/><rect x="152" y="160" width="44" height="152" rx="16"/><rect x="316" y="160" width="44" height="152" rx="16"/><rect x="106" y="186" width="38" height="100" rx="14"/><rect x="368" y="186" width="38" height="100" rx="14"/></g></svg>
  <b>小港重訓手帳</b>
</div>
<div class="wrap">
  <header class="top">
    <h1>小港<span>重訓</span>手帳</h1>
    <p id="subtitle">填好資料，幫你排專屬課表</p>
  </header>
  <div class="runway" aria-hidden="true"></div>
  <div class="people" id="people" role="group" aria-label="切換使用者"></div>
  <main id="view"></main>
</div>

<div class="rest" id="rest" role="status" aria-live="polite">
  <div class="in">
    <div><small>組間休息</small><br><b class="num" id="restT">1:00</b></div>
    <div class="row">
      <button type="button" id="restAdd">+30 秒</button>
      <button type="button" id="restSkip">跳過</button>
    </div>
  </div>
</div>

<nav class="tabs" aria-label="主選單">
  <div class="in">
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>課表</button>
    <button type="button" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h2M20 12h2M6 7v10M18 7v10M9 9v6M15 9v6M9 12h6"/></svg>訓練</button>
    <button type="button" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg>紀錄</button>
    <button type="button" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我的資料</button>
  </div>
</nav>

<script>
/* ================= 動作庫 =================
   f: '2F' 健身中心器械 / 'any' 徒手、任何空地
   sure: 新聞報導確認館內有 / 否則為一般健身房的經典器械，現場確認
   kind: 'm' 器械 / 'bw' 徒手 / 'cardio' 有氧
   全部都是插銷式器械或徒手動作：不用槓鈴、不用深蹲 */
const EX = {
  chestpress:{n:'胸推機',f:'2F',sure:true,kind:'m',cue:'握把對齊胸口中段，推出時不要聳肩，回來時慢慢放。',alt:'pecdeck'},
  pulldown:{n:'滑輪下拉',f:'2F',sure:false,kind:'m',cue:'握距比肩寬，把桿拉到上胸，想像用手肘往下拉。',alt:'assist'},
  assist:{n:'輔助引體機',f:'2F',sure:false,kind:'m',cue:'配重越重越輕鬆；跪或站上踏板，拉到下巴過把。',alt:'pulldown'},
  cablerow:{n:'坐姿划船機',f:'2F',sure:false,kind:'m',cue:'胸口挺起，把握把拉向肚子，背不要前後晃。',alt:'pulldown'},
  shoulderpress:{n:'肩推機',f:'2F',sure:false,kind:'m',cue:'座椅調到握把與肩同高，推到手臂快打直就好。',alt:'lateral'},
  lateral:{n:'側平舉機',f:'2F',sure:false,kind:'m',cue:'手臂往兩側抬到與肩同高，不要聳肩。沒有這台就用很輕的啞鈴。',alt:'revfly'},
  pecdeck:{n:'蝴蝶機夾胸',f:'2F',sure:false,kind:'m',cue:'手肘微彎，像抱大樹一樣往前合，停一秒再打開。',alt:'chestpress'},
  revfly:{n:'反向蝴蝶機',f:'2F',sure:false,kind:'m',cue:'面向椅背坐，手臂往後打開，練肩膀後側和上背。通常跟蝴蝶機是同一台。',alt:'lateral'},
  legpress:{n:'腿推機',f:'2F',sure:false,kind:'m',cue:'腳踩踏板中間，與肩同寬；下背全程貼椅背，推到膝蓋快打直但不要鎖死。',alt:'legext'},
  legcurl:{n:'腿彎舉機',f:'2F',sure:false,kind:'m',cue:'膝蓋對齊機器轉軸，彎到底後慢慢放回。',alt:'abductor'},
  legext:{n:'腿伸展機',f:'2F',sure:false,kind:'m',cue:'坐好、靠背，小腿往上踢到快打直，頂端停一秒。',alt:'legpress'},
  abductor:{n:'髖外展機',f:'2F',sure:false,kind:'m',cue:'坐著把雙腿往外推開，練臀部側邊，慢慢收回。',alt:'legcurl'},
  crunch:{n:'捲腹機',f:'2F',sure:false,kind:'m',cue:'用腹部把上身往前捲，不是用手拉。',alt:''},
  triceps:{n:'三頭下壓（繩索）',f:'2F',sure:false,kind:'m',cue:'手肘夾在身體兩側，只動前臂往下壓。',alt:'chestpress'},
  bicurl:{n:'二頭彎舉機',f:'2F',sure:false,kind:'m',cue:'上臂貼在墊子上，往上彎，慢慢放下。',alt:'cablerow'},
  pushup:{n:'上斜伏地挺身',f:'any',sure:true,kind:'bw',cue:'手撐在椅子或台子邊緣，身體成一直線，越高越輕鬆。',alt:'chestpress'},
  ytw:{n:'俯身 Y-T 字舉',f:'any',sure:true,kind:'bw',cue:'上身前傾，手臂拉成 Y 字再拉成 T 字，徒手就有感覺。',alt:'revfly'},
  glutebridge:{n:'臀橋',f:'any',sure:true,kind:'bw',cue:'躺在地墊上，膝蓋彎曲，用臀部把骨盆往上推，頂端夾緊一秒。',alt:'abductor'},
  clamshell:{n:'側躺蚌殼式',f:'any',sure:true,kind:'bw',cue:'側躺、膝蓋彎曲，腳跟併攏，上面的膝蓋往上打開。',alt:'abductor'},
  plank:{n:'棒式',f:'any',sure:true,kind:'core',cue:'手肘在肩膀正下方，肚子收緊，屁股不要翹高或塌下去。太難就膝蓋著地。',alt:'deadbug'},
  deadbug:{n:'死蟲式',f:'any',sure:true,kind:'core',cue:'躺著，下背貼地，對側手腳慢慢伸直再收回。',alt:'plank'},
  treadmill:{n:'跑步機快走',f:'2F',sure:true,kind:'cardio',cue:'坡度 6–10%、時速 4.5–5.5 公里，盡量不要抓扶手。',alt:'elliptical'},
  elliptical:{n:'滑步機',f:'2F',sure:true,kind:'cardio',cue:'中等強度：會喘，但還能講短句。對膝蓋衝擊小。',alt:'bike'},
  bike:{n:'腳踏車',f:'2F',sure:true,kind:'cardio',cue:'座墊調到踩到最低點時膝蓋微彎；中等強度，會喘但能講話。',alt:'elliptical'}
};
const CORE_REPS = {plank:['20–30 秒','30–45 秒'],deadbug:['每側 6 下','每側 10 下']};
const BW_REPS = {glutebridge:['12–15','15–20'],clamshell:['每側 12','每側 15'],pushup:['8–10','10–15'],ytw:['各 8 下','各 10 下']};

/* ================= 課表範本 ================= */
const TPL = {
  A:{t:'A｜全身',f:'推、拉、腿各一個主要動作',ex:['legpress','chestpress','pulldown','legcurl','shoulderpress','crunch']},
  B:{t:'B｜全身',f:'換個角度，多練背和大腿前側',ex:['legpress','cablerow','pecdeck','legext','revfly','crunch']},
  C:{t:'C｜全身',f:'臀腿加強，核心收尾',ex:['legpress','chestpress','pulldown','legcurl','abductor','crunch']},
  U1:{t:'上半身 1',f:'胸、背、肩、手臂',ex:['chestpress','pulldown','shoulderpress','cablerow','triceps','bicurl']},
  L1:{t:'下半身 1',f:'大腿前後側＋臀部',ex:['legpress','legcurl','legext','abductor','crunch']},
  U2:{t:'上半身 2',f:'背為主，加練肩膀後側',ex:['cablerow','chestpress','pulldown','revfly','lateral','crunch']},
  L2:{t:'下半身 2',f:'臀腿＋核心',ex:['legpress','legext','legcurl','abductor','crunch']}
};
const SPLIT = {2:['A','B'],3:['A','B','C'],4:['U1','L1','U2','L2']};
const GOALS = {
  fat:{n:'減脂',reps:'12–15',rest:60,cardio:20,cmax:30,why:'目標減脂：每組 12–15 下、休息 60 秒，最後接 20 分鐘以上的有氧多消耗熱量。'},
  muscle:{n:'增肌',reps:'8–12',rest:90,cardio:10,cmax:15,why:'目標增肌：每組 8–12 下、休息 90 秒，重量可以重一點；有氧只做 10 分鐘左右。'},
  tone:{n:'體態緊實',reps:'10–15',rest:75,cardio:15,cmax:25,why:'目標體態：每組 10–15 下，重訓和有氧各占一半。'},
  health:{n:'健康體能',reps:'12–15',rest:60,cardio:15,cmax:25,why:'目標健康：重量輕一點、次數多一點，重點是養成習慣。'}
};
const EXP = {new:'沒練過',some:'練過一點',pro:'規律在練'};
const INJ = {
  knee:{n:'膝蓋',rep:{legext:null},cue:{legpress:'膝蓋不適：腳踩高一點，只彎到不痛的角度。'},why:'膝蓋不適：拿掉腿伸展機，腿推機只彎到不痛的角度，有氧改腳踏車或滑步機。'},
  back:{n:'下背／腰',rep:{crunch:null},cue:{legpress:'下背不適：下背全程貼椅背，膝蓋不要彎太深。',cablerow:'下背不適：上身保持直立，不要往前趴、往後倒。'},why:'下背不適：先拿掉捲腹機；腿推機和划船機特別注意下背貼穩。'},
  shoulder:{n:'肩膀',rep:{shoulderpress:'revfly',lateral:'revfly',pecdeck:null,triceps:null},cue:{chestpress:'肩膀不適：推的範圍縮小，回來時手肘不要超過身體。',pulldown:'肩膀不適：拉到下巴高度就好，絕對不要拉到頸後。'},why:'肩膀不適：拿掉肩推、側平舉、蝴蝶機和三頭下壓，改練肩膀後側穩定的反向蝴蝶機。'}
};
const WARM = 6;
/* 90 分鐘以上：時間夠就多排幾個動作（依當天部位）、多一組、有氧拉長 */
const EXTRA = {
  F:['cablerow','pecdeck','lateral','legext','revfly','triceps','bicurl','assist'],
  U:['pecdeck','lateral','revfly','triceps','bicurl','assist'],
  L:['legext','abductor','legcurl','crunch','legpress']
};
const LONG_CARDIO = {fat:60,muscle:25,tone:45,health:45};

/* ================= 依個人資料產生課表 ================= */
function bmiOf(p){return p.w/Math.pow(p.h/100,2);}
function bmiCat(b){return b<18.5?['過輕','var(--warn)']:b<24?['正常','var(--ok)']:b<27?['過重','var(--warn)']:['肥胖','var(--bad)'];}
function estMin(d){let s=0;d.items.forEach(it=>{s+=it.sets*(it.rest+35)});return Math.round(WARM+s/60+d.cardio.min);}

function generate(p){
  const g=GOALS[p.goal], why=[g.why], bmi=bmiOf(p);
  let reps=g.reps, rest=g.rest, sets=p.exp==='new'?2:3;
  if(p.exp==='new') why.push('還沒練過：每個動作先做 2 組，前兩週用輕重量把動作做順，再慢慢加到 3 組。');
  if(p.age>=50){rest+=15; if(reps==='8–12')reps='10–15'; why.push('50 歲以上：組間多休息 15 秒，次數多一點、重量輕一點，對關節比較友善。');}
  const knee=p.inj.includes('knee'), lowImpact=knee||bmi>=30;
  if(bmi>=30&&!knee) why.push('BMI 偏高：有氧選對膝蓋衝擊小的腳踏車和滑步機，先不用跑步機。');
  p.inj.forEach(k=>why.push(INJ[k].why));
  why.push('全部用插銷式器械：調重量只要換插銷，動作軌跡固定，新手也安全；沒有深蹲和槓鈴。');
  const rot = lowImpact?['bike','elliptical']:(p.goal==='fat'?['treadmill','elliptical','bike']:['elliptical','bike','treadmill']);
  const days = SPLIT[p.days].map((k,di)=>{
    const ids=[], cues={};
    TPL[k].ex.forEach(id=>{
      let r=id;
      p.inj.forEach(x=>{ if(r && Object.prototype.hasOwnProperty.call(INJ[x].rep,r)) r=INJ[x].rep[r]; });
      if(r && !ids.includes(r)) ids.push(r);
    });
    const mk=(id,i)=>{
      const e=EX[id]; const c=[];
      p.inj.forEach(x=>{ if(INJ[x].cue[id]) c.push(INJ[x].cue[id]); });
      const lvl=p.exp==='new'?0:1;
      if(e.kind==='core') return {ex:id,sets:Math.min(3,sets),reps:CORE_REPS[id][lvl],rest:45,warn:c};
      if(e.kind==='bw') return {ex:id,sets,reps:BW_REPS[id][lvl],rest:Math.min(rest,60),warn:c};
      let s=sets; if(p.goal==='muscle'&&p.exp==='pro'&&i<2) s=4;
      return {ex:id,sets:s,reps,rest,warn:c};
    };
    const items=ids.map(mk);
    const d={key:k,t:TPL[k].t,f:TPL[k].f,items,cardio:{ex:rot[di%rot.length],min:g.cardio}};
    // 依每次可運動時間調整
    while(estMin(d)>p.mins && d.items.length>4){
      let idx=-1; for(let i=d.items.length-1;i>=3;i--){ if(EX[d.items[i].ex].kind!=='core'){idx=i;break;} }
      if(idx<0) idx=d.items.length-1;
      d.items.splice(idx,1);
    }
    while(estMin(d)>p.mins && d.cardio.min>10) d.cardio.min-=5;
    while(estMin(d)+5<=p.mins && d.cardio.min<g.cmax) d.cardio.min+=5;
    if(p.mins>=90){
      const fits=()=>estMin(d)<=p.mins;
      // 1) 依當天部位多排幾個動作（核心動作留在最後）
      for(const id0 of EXTRA[k[0]==='U'?'U':k[0]==='L'?'L':'F']){
        if(d.items.length>=9) break;
        let r=id0;
        p.inj.forEach(x=>{ if(r && Object.prototype.hasOwnProperty.call(INJ[x].rep,r)) r=INJ[x].rep[r]; });
        if(!r || d.items.some(it=>it.ex===r)) continue;
        let at=d.items.findIndex(it=>EX[it.ex].kind==='core'||it.ex==='crunch'); if(at<0) at=d.items.length;
        d.items.splice(at,0,mk(r,at));
        if(!fits()) d.items.splice(at,1);
      }
      // 2) 器械動作多做一組
      const maxSets=p.exp==='new'?3:4;
      let grew=true;
      while(grew){ grew=false;
        for(const it of d.items){ if(EX[it.ex].kind!=='m'||it.sets>=maxSets) continue; it.sets++; if(fits()) grew=true; else it.sets--; }
      }
      // 3) 剩下的時間給有氧
      while(estMin(d)+5<=p.mins && d.cardio.min<LONG_CARDIO[p.goal]) d.cardio.min+=5;
    }
    return d;
  });
  why.push(`每次可以運動 ${p.mins} 分鐘：動作數和有氧時間都調整到這個長度以內（含 ${WARM} 分鐘熱身）。`);
  if(p.mins>=90) why.push(`時間比較長：多排幾個動作、每個器械多做一組、有氧拉長；剩下的時間留給排隊等器械、喝水和伸展。`);
  return {days,why};
}

/* ================= 建議重量：第一次依體重保守估，之後依上次表現自動加減一格 ================= */
const START = {legpress:.6,chestpress:.3,pulldown:.4,assist:.6,cablerow:.4,shoulderpress:.2,lateral:.1,pecdeck:.2,revfly:.1,legcurl:.25,legext:.25,abductor:.3,crunch:.2,triceps:.15,bicurl:.12};
const BIG = ['legpress','chestpress','pulldown','assist','cablerow','abductor'];
const stepOf=id=>BIG.includes(id)?5:2.5;
const roundW=(id,w)=>{const s=stepOf(id);return Math.max(s,Math.round(w/s)*s);};
function repRange(str){const m=String(str).match(/\d+/g);if(!m)return null;return [+m[0],+(m[1]||m[0])];}
function lastLog(p,id){
  for(let i=p.history.length-1;i>=0;i--){
    const it=p.history[i].items.find(x=>x.ex===id);
    if(it){const done=it.sets.filter(s=>s.done);if(done.length)return done;}
  }
  return null;
}
function suggest(p,id,reps){
  const e=EX[id], rr=repRange(reps);
  if(e.kind!=='m') return {w:'',r:rr?String(rr[0]):'',note:''};
  const L=lastLog(p,id), ws=L?L.map(s=>parseFloat(s.w)).filter(x=>x>0):[];
  if(!ws.length){
    const f=(p.sex==='f'?.6:1)*({new:1,some:1.25,pro:1.5}[p.exp]||1)*(p.age>=50?.85:1);
    return {w:String(roundW(id,p.w*START[id]*f)),r:String(rr[1]),note:'',first:true};
  }
  const base=ws[ws.length-1], rs=L.map(s=>parseInt(s.r)).filter(x=>x>0), inv=id==='assist'?-1:1, st=stepOf(id);
  if(rs.length===L.length&&Math.min(...rs)>=rr[1])
    return {w:String(Math.max(st,base+inv*st)),r:String(rr[0]),note:`上次每組都做到 ${rr[1]} 下，${inv>0?'加':'減'}一格`+(inv<0?'（輔助配重越輕越難）':'')};
  if(rs.length&&Math.min(...rs)<rr[0])
    return {w:String(Math.max(st,base-inv*st)),r:String(rr[1]),note:`上次有一組不到 ${rr[0]} 下，${inv>0?'減':'加'}一格`};
  return {w:String(base),r:String(rr[1]),note:`跟上次一樣重，這次每組拚到 ${rr[1]} 下`};
}
function fillSug(p,c,i){
  const it=c.items[i], id=c.swaps[i]?EX[it.ex].alt:it.ex, sg=suggest(p,id,it.reps);
  c.sug=c.sug||{}; c.sug[i]=sg;
  c.logs[i].forEach(s=>{ if(!s.done&&!s.w&&!s.r){s.w=sg.w;s.r=sg.r;} });
}

function nutrition(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const act={2:1.375,3:1.45,4:1.55}[p.days];
  const tdee=bmr*act;
  let kcal=tdee; if(p.goal==='fat') kcal=Math.max(bmr,tdee-400); if(p.goal==='muscle') kcal=tdee+200;
  const prot=p.w*((p.goal==='fat'||p.goal==='muscle')?1.6:1.2);
  return {kcal:Math.round(kcal/10)*10,prot:Math.round(prot/5)*5,tdee:Math.round(tdee/10)*10};
}

/* ================= 儲存 ================= */
const KEY='xg-gym-v2';
let S={profiles:[],active:null};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const P=()=>S.profiles.find(x=>x.id===S.active)||null;

let tab='plan', editing=false;
if(P()&&P().current) tab='workout';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');};
const floorChip=f=>f==='2F'?'<span class="chip f2">2F 器械區</span>':'<span class="chip fany">徒手・地墊區</span>';
const sureChip=e=>e.sure?'<span class="chip sure">館內確認有</span>':(e.kind==='m'?'<span class="chip guess">常見器械・現場確認</span>':'');

function lastFor(p,id){
  for(let i=p.history.length-1;i>=0;i--){
    const it=p.history[i].items.find(x=>x.ex===id);
    if(it){const done=it.sets.filter(s=>s.done&&(s.w||s.r));if(done.length){const b=done[done.length-1];return (b.w?b.w+' kg':'')+(b.w&&b.r?' × ':'')+(b.r?b.r+(EX[id].kind==='core'?'':' 下'):'');}}
  }
  return '';
}

/* ================= 資料表單 ================= */
function opt(name,val,label,checked,type='radio',small=''){
  return `<label class="opt"><input type="${type}" name="${name}" value="${val}" ${checked?'checked':''}><span>${label}${small?`<small>${small}</small>`:''}</span></label>`;
}
function renderForm(p){
  const isNew=!p; p=p||{name:'',sex:'',age:'',h:'',w:'',goal:'fat',exp:'new',days:3,mins:60,inj:[]};
  return `<form class="panel prof" id="profForm" novalidate>
    <h2 style="font-size:20px">${isNew?(S.profiles.length?'新增一個人':'先填你的資料'):'修改資料'}</h2>
    <label class="field"><span>名字（或暱稱）</span><input class="txt" id="f-name" name="name" maxlength="12" value="${esc(p.name)}" placeholder="例如：Benson" autocomplete="off"></label>
    <fieldset><legend>性別</legend><div class="opts">${opt('sex','m','男',p.sex==='m')}${opt('sex','f','女',p.sex==='f')}</div></fieldset>
    <div class="grid3">
      <label class="field"><span>年齡</span><span class="unit"><input class="txt num" id="f-age" name="age" inputmode="numeric" value="${esc(p.age)}"><em>歲</em></span></label>
      <label class="field"><span>身高</span><span class="unit"><input class="txt num" id="f-h" name="h" inputmode="decimal" value="${esc(p.h)}"><em>cm</em></span></label>
      <label class="field"><span>體重</span><span class="unit"><input class="txt num" id="f-w" name="w" inputmode="decimal" value="${esc(p.w)}"><em>kg</em></span></label>
    </div>
    <fieldset><legend>最主要的目標</legend><div class="opts">${Object.entries(GOALS).map(([k,g])=>opt('goal',k,g.n,p.goal===k)).join('')}</div></fieldset>
    <fieldset><legend>重訓經驗</legend><div class="opts">${Object.entries(EXP).map(([k,n])=>opt('exp',k,n,p.exp===k)).join('')}</div></fieldset>
    <fieldset><legend>一週去幾天</legend><div class="opts">${[2,3,4].map(n=>opt('days',n,n+' 天',p.days===n)).join('')}</div></fieldset>
    <fieldset><legend>每次大概多久</legend><div class="opts">${[45,60,75,90,120].map(n=>opt('mins',n,n===120?'2 小時':n+' 分',p.mins===n,'radio',n===60?'剛好 1 小時票':'')).join('')}</div></fieldset>
    <fieldset><legend>哪裡受過傷或會痛？（可複選，沒有就不用勾）</legend><div class="opts">${Object.entries(INJ).map(([k,x])=>opt('inj',k,x.n,p.inj.includes(k),'checkbox')).join('')}</div></fieldset>
    <p class="err" id="formErr" role="alert"></p>
    <button class="btn primary block" type="submit">${isNew?'產生我的課表':'儲存並重新排課表'}</button>
    ${!isNew?`<button class="btn block" type="button" data-act="cancelEdit">取消</button>`:''}
    ${isNew&&S.profiles.length?`<button class="btn block" type="button" data-act="cancelEdit">取消</button>`:''}
  </form>`;
}
function readForm(f){
  const fd=new FormData(f);
  const num=k=>parseFloat(String(fd.get(k)||'').replace(',','.'));
  const p={name:String(fd.get('name')||'').trim(),sex:fd.get('sex')||'',age:num('age'),h:num('h'),w:num('w'),
    goal:fd.get('goal')||'fat',exp:fd.get('exp')||'new',days:+fd.get('days')||3,mins:+fd.get('mins')||60,inj:fd.getAll('inj')};
  if(!p.name) return [null,'請填名字，方便切換不同人的課表。'];
  if(!p.sex) return [null,'請選性別，用來估算每天的熱量。'];
  if(!(p.age>=14&&p.age<=90)) return [null,'年齡請填 14 到 90 之間的數字。'];
  if(!(p.h>=120&&p.h<=220)) return [null,'身高請填公分，例如 172。'];
  if(!(p.w>=30&&p.w<=250)) return [null,'體重請填公斤，例如 68.5。'];
  return [p,''];
}

/* ================= 課表頁 ================= */
function renderPlan(){
  const p=P(); if(!p||editing) return renderForm(editing==='edit'?p:null);
  const {days,why}=generate(p), b=bmiOf(p), [bc,bcol]=bmiCat(b), nu=nutrition(p);
  const next=p.next%days.length;
  let h='';
  if(p.current) h+=`<div class="banner"><div><b>${esc(p.current.t)}</b><br><small>訓練進行中</small></div><button class="btn" data-act="tab" data-t="workout" type="button">繼續</button></div><div style="height:12px"></div>`;
  h+=`<section class="panel stack">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:18px">${esc(p.name)} 的課表</h2><span class="label">${GOALS[p.goal].n}・一週 ${p.days} 天・每次 ${p.mins} 分</span></div>
    <div class="body-stats">
      <div class="bs"><b class="num">${b.toFixed(1)}</b><small>BMI</small><i style="color:${bcol}">${bc}</i></div>
      <div class="bs"><b class="num">${nu.kcal}</b><small>每天熱量（大卡）</small><i style="color:var(--muted)">${p.goal==='fat'?'比消耗少 400':p.goal==='muscle'?'比消耗多 200':'維持'}</i></div>
      <div class="bs"><b class="num">${nu.prot}</b><small>每天蛋白質（克）</small><i style="color:var(--muted)">約 ${p.goal==='fat'||p.goal==='muscle'?'1.6':'1.2'} g/kg</i></div>
    </div>
    <p class="label" style="margin:0">熱量是用公式粗估的。如果體重兩週都沒變化，再往下調 100–200 大卡。</p>
    <div class="why"><b style="font-size:14px">為什麼這樣排</b><ul>${why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
  </section>
  <h2 class="sec">${days.length} 天輪流練・${['','','週二、週六','週一、三、五','週一、二、四、五'][p.days]}</h2><div class="stack">`;
  days.forEach((d,i)=>{
    h+=`<article class="panel day${i===next?' next':''}">
      <div class="day-head"><div><h2>${esc(d.t)}${i===next?'<span class="tag-next">下次練這天</span>':''}</h2><div class="meta">${esc(d.f)}</div></div>
      <div class="mins"><b class="num">${estMin(d)}</b><small>分鐘</small></div></div>
      <ul class="exlist">${d.items.map(it=>{const e=EX[it.ex];return `<li><span>${esc(e.n)}${!e.sure?'<i class="dot" title="現場確認"></i>':''}${it.warn.length?' <span class="chip guess">注意</span>':''}</span><span class="sr num">${it.sets}×${esc(it.reps)}</span></li>`}).join('')}
      <li><span>${esc(EX[d.cardio.ex].n)}</span><span class="sr">${d.cardio.min} 分</span></li></ul>
      <button class="btn ${i===next?'primary':''} block" type="button" data-act="start" data-day="${i}">開始這天的訓練</button>
    </article>`;
  });
  h+=`</div>
  <div class="legend" style="margin-top:12px"><span><i class="dot" style="width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--warn)"></i> 常見器械，到現場確認有沒有；沒有就在訓練畫面按「換動作」</span></div>
  <h2 class="sec">基本原則</h2>
  <section class="panel notes">
    <div class="note"><b class="k">1</b><p><b>熱身：</b>先騎腳踏車或滑步機 5 分鐘，第一個器械先用很輕的重量做 1 組。</p></div>
    <div class="note"><b class="k">2</b><p><b>重量怎麼選：</b>App 會幫你填好，照著做。做到最後一下時，感覺還能再做 2–3 下最剛好；太輕或太重就直接改數字。</p></div>
    <div class="note"><b class="k">3</b><p><b>什麼時候加重：</b>App 自動排：每組都做到上限，下次加一格；有一組不到下限，下次減一格。</p></div>
    <div class="note"><b class="k">4</b><p><b>會痛就停：</b>肌肉痠是正常的，但關節刺痛、麻就馬上停，換別的動作。</p></div>
  </section>`;
  return h;
}

/* ================= 訓練頁 ================= */
function renderWorkout(){
  const p=P();
  if(!p) return renderForm(null);
  const c=p.current;
  if(!c) return `<div class="panel empty"><p>${esc(p.name)} 目前沒有進行中的訓練。</p><button class="btn primary" type="button" data-act="tab" data-t="plan">到課表挑一天開始</button></div>`;
  if(!c.sug){c.items.forEach((_,k)=>fillSug(p,c,k));save();} // 舊版開始的訓練也補上建議
  let total=1,done=c.cardioDone?1:0;
  c.items.forEach((it,i)=>{total+=c.logs[i].length;done+=c.logs[i].filter(s=>s.done).length});
  const anyFirst=Object.values(c.sug).some(s=>s.first);
  let h=`<div class="wk-head"><div><h2>${esc(p.name)}・${esc(c.t)}</h2><div class="label">已完成 <span class="num">${done}/${total}</span></div></div>
    <div class="clock" id="clock"><b class="num" id="elapsed">0:00</b><small>目標 ${p.mins} 分鐘內</small></div></div>
    <div class="prog" style="margin:10px 0 14px"><i style="width:${Math.round(done/total*100)}%"></i></div><div class="stack">
    ${anyFirst?`<p class="cue sug">重量和次數已經幫你填好，照著做、做完按 ✓。第一次的重量是用體重估的：第一組太輕（還能多做 5 下以上）或太重，就直接改數字，下次會照你改的排。</p>`:''}`;
  c.items.forEach((it,i)=>{
    const id=c.swaps[i]?EX[it.ex].alt:it.ex, e=EX[id], L=c.logs[i], last=lastFor(p,id);
    const bw=e.kind!=='m';
    h+=`<article class="panel ex${L.every(s=>s.done)?' done':''}">
      <div class="ex-top"><div class="stack" style="gap:4px"><div class="row">${floorChip(e.f)}${sureChip(e)}</div><h3>${esc(e.n)}</h3></div>
      ${EX[it.ex].alt?`<button class="btn swap" type="button" data-act="swap" data-i="${i}">${c.swaps[i]?'換回':'換動作'}</button>`:''}</div>
      <div class="presc"><b class="num">${it.sets} × ${esc(it.reps)}</b>・休息 ${fmt(it.rest)}</div>
      <p class="cue">${esc(e.cue)}</p>
      ${c.swaps[i]?'':it.warn.map(w=>`<p class="cue warn">${esc(w)}</p>`).join('')}
      ${last?`<div class="last">上次：${esc(last)}</div>`:''}
      ${c.sug&&c.sug[i]&&c.sug[i].note?`<p class="cue sug">${esc(c.sug[i].note)}</p>`:''}
      <div class="sets"><div class="set hd"><span></span><small>${bw?'':'公斤'}</small><small>${e.kind==='core'?'秒／下':'次數'}</small><span></span></div>${L.map((s,j)=>`<div class="set"><span class="n">${j+1}</span>
        <input id="w-${i}-${j}" inputmode="decimal" placeholder="${bw?'徒手':'公斤'}" value="${esc(s.w)}" data-i="${i}" data-j="${j}" data-k="w" aria-label="第 ${j+1} 組重量">
        <input id="r-${i}-${j}" inputmode="numeric" placeholder="${e.kind==='core'?'秒/下':'次數'}" value="${esc(s.r)}" data-i="${i}" data-j="${j}" data-k="r" aria-label="第 ${j+1} 組次數">
        <button class="tick" type="button" data-act="tick" data-i="${i}" data-j="${j}" aria-pressed="${!!s.done}" aria-label="完成第 ${j+1} 組">✓</button></div>`).join('')}</div>
    </article>`;
  });
  const cid=c.swapCardio?EX[c.cardio.ex].alt:c.cardio.ex, ce=EX[cid];
  h+=`<article class="panel ex${c.cardioDone?' done':''}">
      <div class="ex-top"><div class="stack" style="gap:4px"><div class="row">${floorChip('2F')}<span class="chip sure">收操有氧</span></div><h3>${esc(ce.n)}</h3></div>
      <button class="btn swap" type="button" data-act="swapCardio">${c.swapCardio?'換回':'換動作'}</button></div>
      <div class="presc"><b class="num">${c.cardio.min} 分鐘</b></div>
      <p class="cue">${esc(ce.cue)}</p>
      <button class="tick" type="button" data-act="cardio" aria-pressed="${!!c.cardioDone}" style="width:100%">${c.cardioDone?'✓ 有氧完成':'完成有氧'}</button>
    </article>
    <button class="btn primary block" type="button" data-act="finish">結束訓練並存檔</button>
    <button class="btn danger block" type="button" data-act="abort" id="abortBtn">放棄這次訓練</button></div>`;
  return h;
}

/* ================= 紀錄頁 ================= */
function renderHistory(){
  const p=P(); if(!p) return renderForm(null);
  const H=p.history.slice().reverse(), now=Date.now();
  const wk=p.history.filter(x=>now-new Date(x.date).getTime()<7*864e5).length;
  const first=p.weights&&p.weights.length?p.weights[0].w:p.w;
  let h=`<div class="stats">
    <div class="stat"><b class="num">${p.history.length}</b><small>總訓練次數</small></div>
    <div class="stat"><b class="num">${wk}</b><small>最近 7 天</small></div>
    <div class="stat"><b class="num">${(p.w-first>0?'+':'')+(p.w-first).toFixed(1)}</b><small>體重變化（kg）</small></div></div>
    <p class="label" style="margin:8px 0 0">體重變化：在「我的資料」更新體重時會自動記錄。</p>
    <h2 class="sec">${esc(p.name)} 的訓練紀錄</h2>`;
  if(!H.length) return h+`<div class="panel empty">完成第一次訓練後，紀錄和每個動作用的重量都會出現在這裡。</div>`;
  h+=`<div class="hist">`;
  H.forEach(x=>{
    const dt=new Date(x.date); let n=0;
    x.items.forEach(it=>it.sets.forEach(s=>{if(s.done)n++}));
    const best=x.items.filter(it=>it.sets.some(s=>s.done&&s.w)).slice(0,3).map(it=>EX[it.ex].n+' '+Math.max(...it.sets.filter(s=>s.done&&s.w).map(s=>+s.w||0))+'kg').join('・');
    h+=`<div class="panel hist-item"><div class="d"><b class="num">${dt.getDate()}</b><small>${dt.getMonth()+1} 月</small></div>
      <div><h3>${esc(x.title)}</h3><p>${n} 組・${x.dur} 分鐘${x.cardio?'・有氧完成':''}</p>${best?`<p>${esc(best)}</p>`:''}</div></div>`;
  });
  return h+`</div>`;
}

/* ================= 我的資料 ================= */

  return `<section class="panel stack">
      <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">${esc(p.name)}</h2><button class="btn" type="button" data-act="edit">修改資料</button></div>
      <div class="info"><dl>

/* ================= render ================= */
function render(){
  const p=P();
  $('#subtitle').textContent=p?`${p.name}・${GOALS[p.goal].n}・一週 ${p.days} 練`:'填好資料，幫你排專屬課表';
  $('#people').innerHTML=S.profiles.map(x=>`<button type="button" data-act="switch" data-id="${x.id}" aria-pressed="${x.id===S.active&&!(editing==='new')}">${esc(x.name)}${x.current?' ●':''}</button>`).join('')+(S.profiles.length?`<button type="button" class="add" data-act="addPerson">＋ 新增</button>`:'');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  $('#view').innerHTML= tab==='plan'?renderPlan():tab==='workout'?renderWorkout():tab==='history'?renderHistory():renderMe();
  tickClock();
}
function go(t){tab=t;editing=false;render();window.scrollTo(0,0);}
function keepScroll(){const y=window.scrollY;render();window.scrollTo(0,y);}

let audio=null, restEnd=0, armed='';
function beep(){try{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.2,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.5);o.start();o.stop(audio.currentTime+.5);}catch(e){}}
function startRest(sec){restEnd=Date.now()+sec*1000;$('#rest').classList.add('on');tickClock();}
function stopRest(){restEnd=0;$('#rest').classList.remove('on');}
function arm(btn,key,text,orig){
  if(armed===key){armed='';return true;}
  armed=key;btn.textContent=text;setTimeout(()=>{if(armed===key){armed='';btn.textContent=orig;}},4000);return false;
}

document.addEventListener('submit',ev=>{
  if(ev.target.id!=='profForm')return; ev.preventDefault();
  const [np,err]=readForm(ev.target);
  if(!np){$('#formErr').textContent=err;return;}
  if(editing==='edit'&&P()){
    const p=P();
    if(Math.abs(np.w-p.w)>=0.1){p.weights=p.weights||[{d:p.created,w:p.w}];p.weights.push({d:new Date().toISOString(),w:np.w});}
    Object.assign(p,np);
  }else{
    const id='p'+Date.now().toString(36);
    S.profiles.push(Object.assign(np,{id,history:[],current:null,next:0,created:new Date().toISOString(),weights:[{d:new Date().toISOString(),w:np.w}]}));
    S.active=id;
  }
  save();go('plan');
});

document.addEventListener('click',ev=>{
  try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}}catch(e){}
  const tb=ev.target.closest('nav.tabs button'); if(tb){go(tb.dataset.tab);return;}
  const b=ev.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act, p=P(), c=p&&p.current;
  if(a==='tab') go(b.dataset.t);
  else if(a==='switch'){S.active=b.dataset.id;save();tab=P().current?'workout':'plan';editing=false;stopRest();render();window.scrollTo(0,0);}
  else if(a==='addPerson'){editing='new';tab='me';render();window.scrollTo(0,0);}
  else if(a==='edit'){editing='edit';render();window.scrollTo(0,0);}
  else if(a==='cancelEdit'){editing=false;render();}
  else if(a==='start'){
    const i=+b.dataset.day, d=generate(p).days[i];
    if(c&&!arm(b,'start'+i,'已有進行中的訓練，再按一次改練這天',b.textContent))return;
    p.current={idx:i,t:d.t,start:Date.now(),items:d.items,cardio:d.cardio,swaps:{},swapCardio:false,cardioDone:false,
      logs:d.items.map(it=>Array.from({length:it.sets},()=>({w:'',r:'',done:false})))};
    p.current.items.forEach((_,k)=>fillSug(p,p.current,k));
    save();go('workout');
  }
  else if(a==='swap'){const i=+b.dataset.i;c.swaps[i]=!c.swaps[i];c.logs[i].forEach(s=>{s.w='';s.r='';s.done=false});fillSug(p,c,i);save();render();}
  else if(a==='swapCardio'){c.swapCardio=!c.swapCardio;save();render();}
  else if(a==='tick'){
    const i=+b.dataset.i,j=+b.dataset.j,s=c.logs[i][j];
    s.done=!s.done;save();keepScroll();
    if(s.done) startRest(c.items[i].rest);
  }
  else if(a==='cardio'){c.cardioDone=!c.cardioDone;save();keepScroll();}
  else if(a==='finish'){
    const items=c.items.map((it,i)=>({ex:c.swaps[i]?EX[it.ex].alt:it.ex,sets:c.logs[i]}));
    p.history.push({date:new Date().toISOString(),title:c.t,dur:Math.max(1,Math.round((Date.now()-c.start)/60000)),cardio:c.cardioDone,items});
    p.next=c.idx+1; p.current=null; stopRest(); save(); go('history');
  }
  else if(a==='abort'){
    if(!arm(b,'abort','確定放棄？再按一次','放棄這次訓練'))return;
    p.current=null;stopRest();save();go('plan');
  }
  else if(a==='delPerson'){
    if(!arm(b,'del','紀錄會全部刪除，再按一次確認',b.textContent))return;
    S.profiles=S.profiles.filter(x=>x.id!==p.id);S.active=S.profiles.length?S.profiles[0].id:null;save();go('plan');
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target,p=P(); if(!t.dataset||!t.dataset.k||!p||!p.current)return;
  p.current.logs[+t.dataset.i][+t.dataset.j][t.dataset.k]=t.value.trim(); save();
});
$('#restAdd').addEventListener('click',()=>{restEnd+=30000;tickClock();});
$('#restSkip').addEventListener('click',stopRest);

function tickClock(){
  const el=$('#elapsed'),p=P();
  if(el&&p&&p.current){const sec=(Date.now()-p.current.start)/1000;el.textContent=fmt(sec);$('#clock').classList.toggle('over',sec>p.mins*60);}
  if(restEnd){const left=(restEnd-Date.now())/1000;
    if(left<=0){stopRest();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
    else $('#restT').textContent=fmt(left);}
}
setInterval(tickClock,1000);
render();
/* 自動更新：主畫面 App 會留舊版快取；開啟／切回來時偷看線上版本，有新版就重新載入 */
const APP_VER='2026-11-22a';
function checkUpdate(){
  fetch('./?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const APP_VER='([^']+)'/);
    if(!m||m[1]===APP_VER) return;
    const busy=editing||!P()||(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    let tried=''; try{tried=sessionStorage.getItem('xg-upd')||'';}catch(e){}
    if(busy||tried===m[1]) return; // 同一版只試一次，避免快取沒過期時無限重載
    try{sessionStorage.setItem('xg-upd',m[1]);}catch(e){}
    location.replace('./?u='+encodeURIComponent(m[1]));
  }).catch(()=>{});
}
checkUpdate();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate(); });
(function(){ /* launch splash: keep theme-color in step with the sinking bg, then fade out */
  const d=document.documentElement, sp=document.getElementById('splash');
  if(!d.classList.contains('sp-on')||!sp){if(sp)sp.remove();return;}
  const meta=document.querySelector('meta[name="theme-color"]'), orig=meta&&meta.content;
  let live=true;
  (function track(){if(!live)return; if(meta)meta.content=getComputedStyle(sp).backgroundColor; requestAnimationFrame(track);})();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wait=Math.max(0,(reduce?300:1490)-(Date.now()-(window.__spT0||Date.now())));
  setTimeout(()=>{sp.classList.add('out'); setTimeout(()=>{live=false; if(meta)meta.content=orig; d.classList.remove('sp-on'); sp.remove();},300);},wait);
})();
</script>
